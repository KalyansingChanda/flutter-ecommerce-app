name: ecommerce_app
description: E-Commerce Flutter App like Amazon/Flipkart
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Note: Firebase packages removed due to web incompatibility
  # For Android/iOS builds, add back:
  # firebase_core: ^2.24.2
  # cloud_firestore: ^4.14.0
  # firebase_storage: ^11.6.0
  # firebase_auth: ^4.15.3
  
  # Image handling
  image_picker: ^1.0.7
  
  # Local storage for cart persistence
  shared_preferences: ^2.2.2
  
  # Core packages
  provider: ^6.0.5
  cupertino_icons: ^1.0.2
  
  # UI and utility packages
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/